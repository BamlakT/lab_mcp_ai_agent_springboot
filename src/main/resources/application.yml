spring:
  application:
    name: mcp-agent

management:
  endpoints:
    web:
      exposure:
        include: health,info

github:
  owner: ${GITHUB_OWNER}
  repo: ${GITHUB_REPO}
  
gemini:
  api-key: ${GEMINI_API_KEY}
  model: gemini-1.5-pro
  timeout-seconds: 60
  
openai:
  api-key: demo
  model: gpt-4o-mini
  timeout-seconds: 60

mcp:
  base-url: http://localhost:3333
  path: /mcp
